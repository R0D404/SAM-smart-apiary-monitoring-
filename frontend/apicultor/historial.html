<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM - Historial de visitas</title>
    <!-- Tu CSS global -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/dashboardGlobal.css">
    <link rel="stylesheet" href="../shared/css/historialVisita.css">
    <link rel="stylesheet" href="../shared/css/sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="sidebar">
        <div class="logo">
            <div class="hexagon">
                <img src="../assets/img/logo/logoSam.png" alt="">
            </div>
            <div class="logo-text">
                <h1>SAM</h1>
                <p>Smart Apiary Monitoring</p>
            </div>
        </div>
        <div class="menu">
            <ul>
                <li><a href="dashboardGlobal.html"><img src="../assets/icons/dashboard.svg" alt="" class="menu-icon"> Dashboard</a></li>
                <li><a href="misApiarios.html"><img src="../assets/icons/apiarios.svg" alt="" class="menu-icon"> Mis apiarios</a></li>
                <li><a href="colmenas.html"><img src="../assets/icons/colmenas.svg" alt="" class="menu-icon"> Colmenas</a></li>
                <li><a href="alertas.html"><img src="../assets/icons/alertas.svg" alt="" class="menu-icon"> Alertas</a></li>
                <li><a href="registrarVisita.html"><img src="../assets/icons/visitas.svg" alt="" class="menu-icon"> Registrar visita</a></li>
                <li><a href="historial.html" class="active"><img src="../assets/icons/historial.svg" alt="" class="menu-icon"> Historial</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <div style="width: 41px; height: 41px; border-radius: 50%; background-color: #ffbb00; display: flex; align-items: center; justify-content: center; color: #1e1e1e; font-weight: bold;" id="sidebar-user-avatar">--</div>
            <div class="profile-text">
                <h2 id="sidebar-user-name">--</h2>
                <p>Apicultor</p>
            </div>
        </div>
    </section>
    
    <section class="main-content">
        <!-- Cabecera principal -->
        <header class="main-header" style="justify-content: space-between; align-items: flex-start;">
            <div class="header-left">
                <h1 id="page-title" style="font-size: 24px; font-weight: 600; color: #facc15; margin: 0;">Historial de visitas</h1>
                <p class="subtitle" style="color: #a3a3a3; font-size: 14px; margin-top: 4px; margin-bottom: 0;" id="page-subtitle">Apiario Norte · registros realizados por el apicultor</p>
            </div>
            
            <div class="header-right" style="display: flex; gap: 16px; align-items: center;">
                <button class="btn-primary" onclick="window.location.href='registrarVisita.html'" style="height: 36px; padding: 0 16px; font-size: 14px; font-weight: 500; border-radius: 8px;">Registrar visita</button>
                <button class="user-account" type="button" aria-label="Abrir mi cuenta" onclick="window.location.href='miCuenta.html'">
                    <span class="user-account-dot"></span>
                    <span>Mi Cuenta</span>
                </button>
            </div>
        </header>

        <section class="table-section" style="margin-top: 32px;">

            <!-- FILA DE CONTROLES: Tipo + Apiario + Fecha -->
            <div class="controls-bar">

                <!-- Selector de tipo -->
                <div class="tipo-tabs">
                    <button class="tipo-tab active" data-tipo="visitas">Visitas</button>
                    <button class="tipo-tab" data-tipo="cosechas">Cosechas</button>
                </div>

                <div class="secondary-filters">
                    <!-- Filtro por apiario (se carga dinámicamente) -->
                    <div class="filter-group">
                        <label class="filter-label">Apiario</label>
                        <select id="filtro-apiario" class="filter-select">
                            <option value="">Todos</option>
                        </select>
                    </div>

                    <!-- Filtro por fecha -->
                    <div class="filter-group">
                        <label class="filter-label">Período</label>
                        <div class="date-filter-wrapper">
                            <select id="filtro-fecha-tipo" class="filter-select">
                                <option value="">Sin filtro</option>
                                <option value="anio">Por año</option>
                                <option value="mes">Por mes y año</option>
                                <option value="dia">Fecha exacta</option>
                            </select>
                            <input type="number" id="filtro-anio" class="filter-input" placeholder="2026" min="2020" max="2030" style="display:none; width: 80px;">
                            <input type="month" id="filtro-mes" class="filter-input" style="display:none;">
                            <input type="date" id="filtro-dia" class="filter-input" style="display:none;">
                        </div>
                    </div>

                    <button id="btn-aplicar-filtros" class="btn-primary" style="height:36px; padding: 0 16px; font-size:13px;">Aplicar</button>
                </div>
            </div>

            <!-- Tabla -->
            <div class="table-container" style="margin-top: 24px;">
                <table class="data-table">
                    <thead id="tabla-thead">
                        <!-- JS fill -->
                    </thead>
                    <tbody id="tabla-visitas-body">
                        <!-- JS fill -->
                    </tbody>
                </table>
            </div>
        </section>
    </section>
    
    <script src="../shared/js/sidebar.js" defer></script>
    <script src="../shared/js/historialVisita.js"></script>
</body>
</html>
