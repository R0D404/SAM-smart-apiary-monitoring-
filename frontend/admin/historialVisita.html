<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Visitas - SAM</title>
    <link rel="stylesheet" href="../shared/css/dashboardGlobal.css">
    <link rel="stylesheet" href="../shared/css/historialVisita.css">
    <link rel="stylesheet" href="../shared/css/sidebar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <div class="hexagon">
                    <img src="../assets/img/logo/logoSam.png" alt="Logotipo de SAM">
                </div>
                <div class="logo-text">
                    <h1>SAM</h1>
                    <p>Smart Apiary Monitoring</p>
                </div>
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="dashboardGlobal.html"><img src="../assets/icons/dashboard.svg" alt="" class="menu-icon"> Dashboard</a></li>
                    <li><a href="gestionApiarios.html"><img src="../assets/icons/apiarios.svg" alt="" class="menu-icon"> Apiarios</a></li>
                    <li><a href="gestionColmenas.html"><img src="../assets/icons/colmenas.svg" alt="" class="menu-icon"> Colmenas</a></li>
                    <li><a href="alertas.html"><img src="../assets/icons/alertas.svg" alt="" class="menu-icon"> Alertas</a></li>
                    <li><a aria-current="page" class="active" href="historialVisita.html"><img src="../assets/icons/visitas.svg" alt="" class="menu-icon"> Visitas / Cosechas</a></li>
                    <li><a href="historial.html"><img src="../assets/icons/historial.svg" alt="" class="menu-icon"> Historial</a></li>
                    <li><a href="gestionUsuarios.html"><img src="../assets/icons/usuarios.svg" alt="" class="menu-icon"> Usuarios</a></li>
                </ul>
            </nav>
            <div class="user-profile">
                <div class="user-avatar-indicator">
                    <div class="avatar-initials" id="sidebar-user-avatar">--</div>
                </div>
                <div class="profile-text">
                    <h2 id="sidebar-user-name">--</h2>
                    <p>Administrador</p>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="main-header" style="justify-content: space-between; align-items: flex-start;">
                <div class="header-left">
                    <h1 id="page-title">Historial de registros</h1>
                    <p class="subtitle" style="color: var(--color-text-gray); font-size: 14px; margin-top: 4px;" id="page-subtitle">Visitas, cosechas y mantenimiento de hardware</p>
                </div>
                <div class="header-right">
                    <button class="user-account" type="button" aria-label="Abrir mi cuenta" onclick="window.location.href='miCuenta.html'">
                        <span class="user-account-dot"></span>
                        <span>Mi Cuenta</span>
                    </button>
                </div>
            </header>

            <section class="table-section" style="margin-top: 32px;">

                <!-- FILA DE CONTROLES: Tipo + Apiario + Fecha -->
                <div class="controls-bar">

                    <!-- Selector de tipo -->
                    <div class="tipo-tabs">
                        <button class="tipo-tab active" data-tipo="visitas">Visitas</button>
                        <button class="tipo-tab" data-tipo="cosechas">Cosechas</button>
                        <button class="tipo-tab" data-tipo="mantenimiento">Mantenimiento hardware</button>
                    </div>

                    <div class="secondary-filters">
                        <!-- Filtro por apiario (se carga dinámicamente) -->
                        <div class="filter-group">
                            <label class="filter-label">Apiario</label>
                            <select id="filtro-apiario" class="filter-select">
                                <option value="">Todos</option>
                            </select>
                        </div>

                        <!-- Filtro por fecha -->
                        <div class="filter-group">
                            <label class="filter-label">Período</label>
                            <div class="date-filter-wrapper">
                                <select id="filtro-fecha-tipo" class="filter-select">
                                    <option value="">Sin filtro</option>
                                    <option value="anio">Por año</option>
                                    <option value="mes">Por mes y año</option>
                                    <option value="dia">Fecha exacta</option>
                                </select>
                                <input type="number" id="filtro-anio" class="filter-input" placeholder="2026" min="2020" max="2030" style="display:none; width: 80px;">
                                <input type="month" id="filtro-mes" class="filter-input" style="display:none;">
                                <input type="date" id="filtro-dia" class="filter-input" style="display:none;">
                            </div>
                        </div>

                        <button id="btn-aplicar-filtros" class="btn-primary" style="height:36px; padding: 0 16px; font-size:13px;">Aplicar</button>
                    </div>
                </div>

                <!-- Tabla -->
                <div class="table-container" style="margin-top: 24px;">
                    <table class="data-table">
                        <thead id="tabla-thead">
                            <!-- JS fill -->
                        </thead>
                        <tbody id="tabla-visitas-body">
                            <!-- JS fill -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../shared/js/historialVisita.js?v=3"></script>
    <script src="../shared/js/sidebar.js"></script>
</body>
</html>
