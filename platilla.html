<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM - Smart Apiary Monitoring</title>
    <link rel="stylesheet" href="./frontend/shared/css/plantilla.css">
</head>
<body>
    <div class="app-shell">
        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar" aria-label="Navegación principal">
            <div class="logo">
                <div class="hexagon">
                    <img src="./frontend/assets/img/logo/logoSam.png" alt="Logotipo de SAM">
                </div>
                <div class="logo-text">
                    <h1>SAM</h1>
                    <p>Smart Apiary</p>
                </div>
            </div>
            <nav class="menu" aria-label="Secciones del sistema">
                <ul>
                    <li><a href="#"><img src="./frontend/assets/icons/dashboard.svg" alt="" class="menu-icon"> Dashboard</a></li>
                    <li><a href="#"><img src="./frontend/assets/icons/apiarios.svg" alt="" class="menu-icon"> Apiarios</a></li>
                    <li><a href="#"><img src="./frontend/assets/icons/colmenas.svg" alt="" class="menu-icon"> Colmenas</a></li>
                    <li><a href="#"><img src="./frontend/assets/icons/alertas.svg" alt="" class="menu-icon"> Alertas</a></li>
                    <li><a href="#"><img src="./frontend/assets/icons/visitas.svg" alt="" class="menu-icon"> Visitas / Cosechas</a></li>
                    <li><a href="#"><img src="./frontend/assets/icons/historial.svg" alt="" class="menu-icon"> Historial</a></li>
                    <li><a href="#"><img src="./frontend/assets/icons/usuarios.svg" alt="" class="menu-icon"> Usuarios</a></li>
                </ul>
            </nav>
            <div class="user-profile">
                <div class="user-avatar-indicator">
                    <img src="./frontend/assets/img/users/userAdmin.png" alt="Foto de perfil" class="avatar-photo" id="sidebar-user-photo">
                    <div class="avatar-initials" id="sidebar-user-avatar">--</div>
                    <span class="status-dot online"></span>
                </div>
                <div class="profile-text">
                    <h2 id="sidebar-user-name">---</h2>
                    <p>Administrador</p>
                </div>
            </div>
        </aside>

        <!-- ========== CONTENIDO PRINCIPAL ========== -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <!-- Título de la página: cambiar según la sección -->
                </div>
                <div class="header-right">
                    <button class="user-account" type="button" aria-label="Abrir mi cuenta">
                        <span class="user-account-dot"></span>
                        <span>Mi Cuenta</span>
                    </button>
                </div>
            </header>

            <!-- Aquí va el contenido específico de cada página -->

        </main>
    </div>
</body>
</html>
